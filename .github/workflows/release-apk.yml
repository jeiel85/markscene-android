name: Release APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo "Error: RELEASE_KEYSTORE is not set."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ]; then
            echo "Error: RELEASE_STORE_PASSWORD is not set."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]; then
            echo "Error: RELEASE_KEY_ALIAS is not set."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "Error: RELEASE_KEY_PASSWORD is not set."
            exit 1
          fi
        shell: bash

      - name: Prepare Signing Key
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" > keystore.base64
          base64 -d keystore.base64 > app/release.jks
          test -f app/release.jks
        shell: bash

      - name: Build release APK
        run: ./gradlew :app:assembleRelease
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
