name: Android CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit Test
        run: ./gradlew :app:testDebugUnitTest

      - name: Restore debug keystore
        run: |
          mkdir -p keystore
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run integration tests and launch smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          script: |
            adb wait-for-device
            i=0
            while [ "$i" -lt 60 ]; do
              BOOT_COMPLETED="$(adb shell getprop sys.boot_completed | tr -d '\r')"
              SDK_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              case "$SDK_LEVEL" in
                ''|*[!0-9]*) ;;
                *) if [ "$BOOT_COMPLETED" = "1" ] && [ "$SDK_LEVEL" -ge 21 ]; then break; fi ;;
              esac
              i=$((i + 1))
              sleep 5
            done
            case "$SDK_LEVEL" in
              ''|*[!0-9]*) echo "Emulator SDK level is not ready: '$SDK_LEVEL'"; adb devices -l; exit 1 ;;
            esac
            if [ "$BOOT_COMPLETED" != "1" ] || [ "$SDK_LEVEL" -lt 21 ]; then
              echo "Emulator is not ready: boot=$BOOT_COMPLETED sdk=$SDK_LEVEL"
              adb devices -l
              exit 1
            fi
            adb shell cmd package list packages >/dev/null
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.markscene.app/.MainActivity
            adb shell pidof com.markscene.app
